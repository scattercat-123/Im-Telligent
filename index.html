<head>
  <script src="script.js"></script>

<body> <!--nga lemme terminal-->
  <div class="container-fluid pt-5" id="Banner">
    <h1>IM-TELLIGENT</h1>
    <h2>A Easy to use educational helper for students!</h2>
    <button><a href="db.html">database</a></button>
  </div>
  <div>
    <label for="apikey" class="sr-only">API Key</label>
    <input type="text" id="apikey" title="API Key" placeholder="Enter API key" class="form-control">

    <button onclick="assignapi()">Set API Key</button>

    <select class="form-control" id="ai-picker" title="Select an AI provider">
      <option value="gemini">Google Gemini (free)</option>
      <option value="openai">OpenAI GPT-4</option>
      <option value="claude">Anthropic Claude</option>
      <option value="groq">Groq</option>
    </select>
  </div>


  <div><!--heres the ai thing-->
    <select class="form-select" id="tool-picker" title="Select a tool" aria-label="Tool picker"
      onchange="switchTo(this.value)">
      <option value="math">Math helper</option>
      <option value="explain">Explain this</option>
      <option value="essay">Essay feedback</option>
      <option value="diagram">Diagram labeller</option>
      <option value="compound">Compound reactor</option>
      <option value="balancer">Equation balancer</option>
      <option value="graph">Graph plotter</option>
      <option value="notes">Note structurizer</option>
      <option value="audio">Audio to notes</option>
      <option value="simplifier">Problem simplifier</option>
      <option value="quiz">Quiz generator</option>
      <option value="syllabus">Syllabus analyzer</option>
      <option value="project">Project feedback</option>
    </select>
    <div id="panel-math" style="display:block">
      <div id="math-output" class="border rounded p-2 mb-2" style="height:300px; overflow-y:auto;"></div>
      <textarea class="form-control mb-2" id="problemmath" rows="2"
        placeholder="Type your problem or reply..."></textarea>
      <button class="btn btn-primary" onclick="solvemath()">Send</button>
      <button class="btn btn-secondary" onclick="resetMath()">New problem</button>

      
    </div>
    <div id="panel-explain" style="display:none">

      <textarea class="form-control" id="explain" rows="6" placeholder="What should i explain?"></textarea>

    </div>
    <div id="panel-essay" style="display:none">

      <textarea class="form-control" id="essay" rows="6" placeholder="Paste your essay..."></textarea>

    </div>
    <div id="panel-diagram" style="display:none">

      <input type="file" class="form-control" id="diagram" accept="image/*">

    </div>
    <div id="panel-compound" style="display:none">

      compound inputs -->

    </div>
    <div id="panel-balancer" style="display:none">

      balancer inputs -->

    </div>
    <div id="panel-graph" style="display:none">

      graph inputs -->

    </div>
    <div id="panel-notes" style="display:none">

      notes inputs -->

    </div>
    <div id="panel-audio" style="display:none">

      audio inputs -->

    </div>
    <div id="panel-simplifier" style="display:none">

      simplifier inputs -->

    </div>
    <div id="panel-quiz" style="display:none">

      quiz inputs -->

    </div>
    <div id="panel-syllabus" style="display:none">

      syllabus inputs -->

    </div>
    <div id="panel-project" style="display:none">
      s
      project inputs -->

    </div>
  </div>
